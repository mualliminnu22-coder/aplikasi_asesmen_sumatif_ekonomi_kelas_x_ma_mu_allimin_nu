        function showModal(title, message, type = 'info', buttons = []) {
            const modal = document.getElementById('customModal');
            const container = document.getElementById('modalContainer');
            const iconEl = document.getElementById('modalIcon');
            const titleEl = document.getElementById('modalTitle');
            const msgEl = document.getElementById('modalMessage');
            const btnContainer = document.getElementById('modalButtons');

            titleEl.textContent = title;
            msgEl.textContent = message;
            btnContainer.innerHTML = '';

            iconEl.className = "w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl ";
            if (type === 'success') {
                iconEl.classList.add('bg-emerald-100', 'text-emerald-600');
                iconEl.innerHTML = '<i class="fa-solid fa-check"></i>';
            } else if (type === 'error') {
                iconEl.classList.add('bg-rose-100', 'text-rose-600');
                iconEl.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i>';
            } else if (type === 'warning') {
                iconEl.classList.add('bg-amber-100', 'text-amber-600');
                iconEl.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i>';
            } else {
                iconEl.classList.add('bg-cyan-100', 'text-cyan-600');
                iconEl.innerHTML = '<i class="fa-solid fa-circle-info"></i>';
            }

            if (buttons.length === 0) {
                buttons = [{
                    text: 'Tutup',
                    class: 'bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2.5 rounded-xl font-medium w-full shadow-lg shadow-emerald-600/20 transition-all',
                    onClick: () => closeModal()
                }];
            }

            buttons.forEach(btn => {
                const b = document.createElement('button');
                b.textContent = btn.text;
                b.className = btn.class || 'bg-slate-200 hover:bg-slate-300 text-slate-800 px-5 py-2.5 rounded-xl font-medium transition-all';
                b.onclick = () => {
                    if (btn.onClick) btn.onClick();
                    closeModal();
                };
                btnContainer.appendChild(b);
            });

            modal.classList.remove('hidden');
            setTimeout(() => {
                container.classList.remove('scale-95', 'opacity-0');
                container.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('customModal');
            const container = document.getElementById('modalContainer');
            container.classList.remove('scale-100', 'opacity-100');
            container.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 150);
        }

        function renderLoginView() {
            return `
            <div class="flex-grow flex items-center justify-center p-4 bg-gradient-to-br from-indigo-900 via-blue-900 to-slate-900">

                        <button onclick="handleStudentLogin()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3.5 rounded-xl shadow-lg shadow-indigo-600/30 transition-all flex items-center justify-center space-x-2">

                        Penyusun: ${appConfig.teacher} • ${appConfig.logoText}

        }

        function switchLoginTab(tab) {
            const tabStudent = document.getElementById('tabStudent');
            const tabAdmin = document.getElementById('tabAdmin');
            const studentForm = document.getElementById('studentForm');
            const adminForm = document.getElementById('adminForm');

            if (tab === 'student') {
                tabStudent.className = "flex-1 py-2.5 rounded-lg text-sm font-semibold transition-all bg-white text-indigo-700 shadow-sm";
                tabAdmin.className = "flex-1 py-2.5 rounded-lg text-sm font-semibold transition-all text-slate-600 hover:text-slate-900";
                studentForm.classList.remove('hidden');
                adminForm.classList.add('hidden');
            } else {
                tabAdmin.className = "flex-1 py-2.5 rounded-lg text-sm font-semibold transition-all bg-white text-slate-900 shadow-sm";
                tabStudent.className = "flex-1 py-2.5 rounded-lg text-sm font-semibold transition-all text-slate-600 hover:text-slate-900";
                adminForm.classList.remove('hidden');
                studentForm.classList.add('hidden');
            }
        }

        function handleStudentLogin() {
            const name = document.getElementById('studentName').value.trim();
            const className = document.getElementById('studentClass').value;
            const number = document.getElementById('studentNumber').value.trim();

            if (!name || !number) {
                showModal('Peringatan', 'Harap isi Nama Lengkap dan Nomor Presensi dengan benar!', 'warning');
                return;
            }

            const studentId = `${name}_${className}_${number}`.toLowerCase();
            const pastSubmissions = studentSubmissions.filter(s => s.studentId === studentId);
            
            if (pastSubmissions.length >= 2) {
                showModal('Batas Pengerjaan Habis', `Maaf, ${name} (No. Presensi ${number}) telah menggunakan kesempatan mengerjakan sebanyak 2 kali.`, 'error');
                return;
            }

            currentUser = {
                role: 'student',
                name: name,
                className: className,
                number: number,
                studentId: studentId,
                attemptCount: pastSubmissions.length + 1
            };

            examState = {
                answers: {},
                timeLeft: appConfig.durationMinutes * 60,
                timerInterval: null,
                isSubmitted: false
            };

            currentView = 'exam';
            render();
            startExamTimer();
        }

        function handleAdminLogin() {
            const user = document.getElementById('adminUser').value.trim();
            const pass = document.getElementById('adminPass').value;

            if (user === appConfig.adminCreds.username && pass === appConfig.adminCreds.password) {
                currentUser = { role: 'admin', name: 'Administrator / Guru' };
                currentView = 'admin';
                render();
            } else {
                showModal('Login Gagal', 'Username atau Password admin salah!', 'error');
            }
        }

        let currentQuestionIndex = 0;

        function renderExamView() {
            const q = questions[currentQuestionIndex];
            const totalQ = questions.length;
            const answeredCount = Object.keys(examState.answers).length;

            return `
            <div class="flex-grow flex flex-col bg-slate-100">
                <!-- Top Navbar -->
                <header class="bg-white border-b border-slate-200 sticky top-0 z-30 px-6 py-4 flex items-center justify-between shadow-sm">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-bold">
                            <i class="fa-solid fa-scale-balanced"></i>
                        </div>
                        <div>
                            <h2 class="font-bold text-slate-800 text-sm md:text-base">${appConfig.subject} (${appConfig.logoText})</h2>
                            <p class="text-xs text-slate-500">Siswa: <span class="font-semibold text-slate-700">${currentUser.name}</span> (${currentUser.className} - No. ${currentUser.number}) • Percobaan ke-${currentUser.attemptCount}/2</p>
                        </div>
                    </div>
                    <div class="flex items-center space-x-4">
                        <div class="bg-amber-50 border border-amber-200 text-amber-800 px-4 py-2 rounded-xl flex items-center space-x-2 shadow-inner">
                            <i class="fa-regular fa-clock text-amber-600"></i>
                            <span id="timerDisplay" class="font-mono font-bold text-sm md:text-base">00:00:00</span>
                        </div>
                        ${currentUser.isTestMode ? `<button onclick="exitTestMode()" class="bg-rose-600 hover:bg-rose-700 text-white px-4 py-2 rounded-xl text-xs font-semibold shadow">Keluar Uji Coba</button>` : ''}
                    </div>
                </header>

                <!-- Main Content Area -->
                <div class="max-w-6xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-4 gap-6 flex-grow">
                    <!-- Left: Question Card -->
                    <div class="lg:col-span-3 bg-white rounded-2xl shadow-sm border border-slate-200 p-6 flex flex-col justify-between">
                        <div>
                            <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-100">
                                <span class="px-3 py-1 bg-indigo-100 text-indigo-800 rounded-lg text-xs font-bold uppercase tracking-wider">
                                    Soal No. ${currentQuestionIndex + 1} dari ${totalQ} (${q.type === 'mc' ? 'Pilihan Ganda' : q.type === 'complex' ? 'Pilihan Ganda Kompleks' : 'Menjodohkan'})
                                </span>
                                <span class="text-xs text-slate-400 font-medium">Terjawab: ${answeredCount}/${totalQ}</span>
                            </div>

                            <div class="text-slate-900 font-medium text-base md:text-lg mb-6 leading-relaxed">
                                ${q.question}
                            </div>

                            <!-- Options Rendering -->
                            <div id="questionOptionsContainer" class="space-y-3">
                                ${renderQuestionOptions(q)}
                            </div>
                        </div>

                        <!-- Navigation Footer -->
                        <div class="flex items-center justify-between pt-6 mt-8 border-t border-slate-100">
                            <button onclick="prevQuestion()" ${currentQuestionIndex === 0 ? 'disabled' : ''} class="px-5 py-2.5 rounded-xl border border-slate-300 font-medium text-slate-700 hover:bg-slate-50 disabled:opacity-40 disabled:cursor-not-allowed transition-all flex items-center space-x-2">
                                <i class="fa-solid fa-arrow-left"></i>
                                <span>Sebelumnya</span>
                            </button>
                            
                            ${currentQuestionIndex === totalQ - 1 ? 
                                `<button onclick="confirmSubmitExam()" class="px-6 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold shadow-lg shadow-indigo-600/20 transition-all flex items-center space-x-2">
                                    <span>Selesaikan Asesmen</span>
                                    <i class="fa-solid fa-check"></i>
                                 </button>` :
                                `<button onclick="nextQuestion()" class="px-6 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold shadow-lg shadow-indigo-600/20 transition-all flex items-center space-x-2">
                                    <span>Selanjutnya</span>
                                    <i class="fa-solid fa-arrow-right"></i>
                                 </button>`
                            }
                        </div>
                    </div>

                    <!-- Right: Question Palette / Navigator -->
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 flex flex-col">
                        <h3 class="font-bold text-slate-800 text-sm mb-3 flex items-center justify-between">
                            <span>Daftar Soal</span>
                            <span class="text-xs font-normal text-slate-500">Klik untuk lompat</span>
                        </h3>
                        <div class="grid grid-cols-5 gap-2 overflow-y-auto max-h-[380px] custom-scrollbar p-1">
                            ${questions.map((item, idx) => {
                                const isAnswered = examState.answers[item.id] !== undefined && 
                                    (Array.isArray(examState.answers[item.id]) ? examState.answers[item.id].length > 0 : 
                                    typeof examState.answers[item.id] === 'object' ? Object.keys(examState.answers[item.id]).length > 0 : 
                                    examState.answers[item.id] !== '');
                                const isCurrent = currentQuestionIndex === idx;
                                
                                let btnClass = "h-10 rounded-xl text-xs font-bold transition-all flex items-center justify-center border ";
                                if (isCurrent) {
                                    btnClass += "border-indigo-600 bg-indigo-50 text-indigo-700 ring-2 ring-indigo-500/20";
                                } else if (isAnswered) {
                                    btnClass += "bg-indigo-600 text-white border-indigo-600 shadow-sm";
                                } else {
                                    btnClass += "bg-slate-100 text-slate-700 border-slate-200 hover:bg-slate-200";
                                }

                                return `<button onclick="jumpToQuestion(${idx})" class="${btnClass}">${idx + 1}</button>`;
                            }).join('')}
                        </div>

                        <div class="mt-auto pt-4 border-t border-slate-100 text-xs text-slate-500 space-y-1.5">
                            <div class="flex items-center space-x-2"><span class="w-3 h-3 rounded bg-indigo-600 inline-block"></span><span>Sudah dijawab</span></div>
                            <div class="flex items-center space-x-2"><span class="w-3 h-3 rounded bg-slate-100 border border-slate-300 inline-block"></span><span>Belum dijawab</span></div>
                        </div>

                        <button onclick="confirmSubmitExam()" class="mt-4 w-full py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-semibold text-xs transition-all shadow">
                            Kirim Jawaban Sekarang
                        </button>
                    </div>
                </div>
            </div>
            `;
        }

        function renderQuestionOptions(q) {
            const currentAns = examState.answers[q.id];

            if (q.type === 'mc') {
                return Object.entries(q.options).map(([key, text]) => {
                    const isChecked = currentAns === key;
                    return `
                    <label onclick="saveAnswer(${q.id}, '${key}')" class="flex items-start space-x-3 p-4 rounded-xl border ${isChecked ? 'border-indigo-600 bg-indigo-50/60 ring-1 ring-indigo-600' : 'border-slate-200 hover:bg-slate-50'} cursor-pointer transition-all">
                        <input type="radio" name="q_${q.id}" value="${key}" ${isChecked ? 'checked' : ''} class="mt-1 text-indigo-600 focus:ring-indigo-500">
                        <div class="flex-grow text-sm"><span class="font-bold mr-2 text-slate-700">${key}.</span>${text}</div>
                    </label>
                    `;
                }).join('');
            } else if (q.type === 'complex') {
                const selectedList = Array.isArray(currentAns) ? currentAns : [];
                return Object.entries(q.options).map(([key, text]) => {
                    const isChecked = selectedList.includes(key);
                    return `
                    <label onclick="toggleComplexAnswer(${q.id}, '${key}')" class="flex items-start space-x-3 p-4 rounded-xl border ${isChecked ? 'border-indigo-600 bg-indigo-50/60 ring-1 ring-indigo-600' : 'border-slate-200 hover:bg-slate-50'} cursor-pointer transition-all">
                        <input type="checkbox" ${isChecked ? 'checked' : ''} class="mt-1 rounded text-indigo-600 focus:ring-indigo-500">
                        <div class="flex-grow text-sm"><span class="font-bold mr-2 text-slate-700">${key}.</span>${text}</div>
                    </label>
                    `;
                }).join('');
            } else if (q.type === 'matching') {
                const userPairAns = (typeof currentAns === 'object' && currentAns !== null) ? currentAns : {};
                const allMatches = q.pairs.map(p => p.match);

                return q.pairs.map((pairItem, pIdx) => {
                    const selectedMatch = userPairAns[pIdx] || '';
                    return `
                    <div class="p-4 rounded-xl border border-slate-200 bg-slate-50/50 space-y-2">
                        <div class="text-sm font-semibold text-slate-800"><span class="text-indigo-700 mr-2">${pIdx + 1}.</span>${pairItem.premise}</div>
                        <select onchange="saveMatchingAnswer(${q.id}, ${pIdx}, this.value)" class="w-full p-2.5 rounded-lg border border-slate-300 text-sm bg-white focus:ring-2 focus:ring-indigo-500 outline-none">
                            <option value="">-- Pilih Pasangan Jawaban --</option>
                            ${allMatches.map(m => `<option value="${m}" ${selectedMatch === m ? 'selected' : ''}>${m}</option>`).join('')}
                        </select>
                    </div>
                    `;
                }).join('');
            }
            return '';
        }

        function saveAnswer(qId, val) {
            examState.answers[qId] = val;
            render();
        }

        function toggleComplexAnswer(qId, key) {
            let current = examState.answers[qId];
            if (!Array.isArray(current)) current = [];
            
            if (current.includes(key)) {
                current = current.filter(item => item !== key);
            } else {
                current.push(key);
            }
            examState.answers[qId] = current;
            render();
        }

        function saveMatchingAnswer(qId, pairIdx, val) {
            if (typeof examState.answers[qId] !== 'object' || examState.answers[qId] === null) {
                examState.answers[qId] = {};
            }
            examState.answers[qId][pairIdx] = val;
        }

        function nextQuestion() {
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                render();
            }
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                render();
            }
        }

        function jumpToQuestion(idx) {
            currentQuestionIndex = idx;
            render();
        }

        function startExamTimer() {
            if (examState.timerInterval) clearInterval(examState.timerInterval);
            
            examState.timerInterval = setInterval(() => {
                examState.timeLeft--;
                const display = document.getElementById('timerDisplay');
                if (display) {
                    const hrs = Math.floor(examState.timeLeft / 3600);
                    const mins = Math.floor((examState.timeLeft % 3600) / 60);
                    const secs = examState.timeLeft % 60;
                    display.textContent = `${hrs.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                }

                if (examState.timeLeft <= 0) {
                    clearInterval(examState.timerInterval);
                    showModal('Waktu Habis', 'Waktu pengerjaan asesmen telah habis. Sistem akan mengirimkan jawaban Anda secara otomatis.', 'warning', [{
                        text: 'OK', class: 'bg-indigo-600 text-white px-5 py-2.5 rounded-xl font-medium', onClick: () => submitExam()
                    }]);
                }
            }, 1000);
        }

        function confirmSubmitExam() {
            showModal('Konfirmasi Kirim', 'Apakah Anda yakin ingin menyelesaikan dan mengirimkan jawaban asesmen ini? Setelah dikirim, jawaban tidak dapat diubah.', 'warning', [
                { text: 'Periksa Lagi', class: 'bg-slate-200 hover:bg-slate-300 text-slate-800 px-5 py-2.5 rounded-xl font-medium', onClick: () => {} },
                { text: 'Ya, Kirim Sekarang', class: 'bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-xl font-medium shadow-lg shadow-indigo-600/20', onClick: () => submitExam() }
            ]);
        }

        function submitExam() {
            if (examState.timerInterval) clearInterval(examState.timerInterval);
            examState.isSubmitted = true;

            let totalScore = 0;
            let correctCount = 0;

            questions.forEach(q => {
                const userAns = examState.answers[q.id];
                let isCorrect = false;

                if (q.type === 'mc') {
                    if (userAns === q.correct) {
                        isCorrect = true;
                        totalScore += (100 / 35);
                    }
                } else if (q.type === 'complex') {
                    if (Array.isArray(userAns)) {
                        const sortedUser = [...userAns].sort();
                        const sortedCorrect = [...q.correct].sort();
                        if (JSON.stringify(sortedUser) === JSON.stringify(sortedCorrect)) {
                            isCorrect = true;
                            totalScore += (100 / 35);
                        }
                    }
                } else if (q.type === 'matching') {
                    if (typeof userAns === 'object' && userAns !== null) {
                        let allPairCorrect = true;
                        q.pairs.forEach((pair, pIdx) => {
                            if (userAns[pIdx] !== pair.match) {
                                allPairCorrect = false;
                            }
                        });
                        if (allPairCorrect) {
                            isCorrect = true;
                            totalScore += (100 / 35);
                        }
                    }
                }

                if (isCorrect) correctCount++;
            });

            const finalScore = Math.min(100, Math.round(totalScore));
            const status = finalScore >= appConfig.kkm ? 'LULUS (TUNTAS)' : 'BELUM TUNTAS';

            const submissionRecord = {
                id: 'sub_' + Date.now(),
                studentId: currentUser.studentId,
                name: currentUser.name,
                className: currentUser.className,
                number: currentUser.number,
                attempt: currentUser.attemptCount,
                score: finalScore,
                correctCount: correctCount,
                status: status,
                timestamp: new Date().toLocaleString('id-ID'),
                answers: examState.answers
            };

            studentSubmissions.push(submissionRecord);
            localStorage.setItem('muallimin_pkn9_submissions_v1', JSON.stringify(studentSubmissions));

            currentUser.lastSubmission = submissionRecord;
            currentView = 'result';
            render();
        }

                modalHtml += `<div class="space-y-2">
                    <label class="block text-xs font-semibold text-slate-600">Pilihan Jawaban</label>`;
                Object.entries(q.options).forEach(([k, val]) => {
                    modalHtml += `<div class="flex items-center space-x-2">
                        <span class="font-bold text-sm w-6">${k}.</span>
                        <input type="text" id="editOpt_${k}" value="${val}" class="w-full p-2 rounded-lg border border-slate-300 text-sm outline-none">
                    </div>`;
                });
                modalHtml += `</div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Kunci Jawaban Benar ${q.type === 'complex' ? '(Pisahkan koma, contoh: A,C)' : ''}</label>
                    <input type="text" id="editCorrect" value="${Array.isArray(q.correct) ? q.correct.join(',') : q.correct}" class="w-full p-2.5 rounded-xl border border-slate-300 text-sm outline-none font-bold text-indigo-700">
                </div>`;
            } else {
                modalHtml += `<p class="text-xs text-amber-600 italic">Soal menjodohkan dapat dikonfigurasi pada bank data soal utama.</p>`;
            }

            modalHtml += `</div>`;

            showModal(`Edit Soal No. ${idx + 1}`, modalHtml, 'info', [
                { text: 'Batal', class: 'bg-slate-200 text-slate-800 px-4 py-2 rounded-xl text-sm font-medium', onClick: () => {} },
                { text: 'Simpan Perubahan', class: 'bg-indigo-600 text-white px-5 py-2 rounded-xl text-sm font-medium shadow', onClick: () => {
                    const newText = document.getElementById('editQText').value.trim();
                    if (newText) q.question = newText;

                    if (q.type !== 'matching') {
                        Object.keys(q.options).forEach(k => {
                            const optVal = document.getElementById(`editOpt_${k}`).value.trim();
                            if (optVal) q.options[k] = optVal;
                        });
                        const corrInput = document.getElementById('editCorrect').value.trim();
                        if (q.type === 'complex') {
                            q.correct = corrInput.toUpperCase().split(',').map(s => s.trim());
                        } else {
                            q.correct = corrInput.toUpperCase();
                        }
                    }

                    localStorage.setItem('muallimin_pkn9_questions_v1', JSON.stringify(questions));
                    render();
                    showModal('Berhasil', 'Butir soal berhasil diperbarui!', 'success');
                }}
            ]);
        }

        // Initialize App on load
        window.onload = function() {
            render();
        };
    </script>
</body>
</html>
